[project]
name = "hyperliquid-trading-alert-system"
version = "0.1.0"
description = "Production-grade backend for Hyperliquid price alerts with FastAPI, PostgreSQL, and async workers"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "TobyKThurston"}
]
keywords = ["hyperliquid", "trading", "alerts", "cryptocurrency", "fastapi", "postgresql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",  # Required for Alembic migrations (sync driver)
    "httpx>=0.25.0",
    "websockets>=12.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",  # For test client
    "aiosqlite>=0.19.0",  # For SQLite async tests
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "db", "worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",  # Line length handled by formatter
    "E712",  # `== True` is the SQLAlchemy idiom for column comparisons
    "N806",  # Allow uppercase locals (intentional constants inside functions)
    "N818",  # Existing exception class names without Error suffix
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F841"]  # Unused locals in tests are often intentional

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["api", "worker", "db", "core"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

